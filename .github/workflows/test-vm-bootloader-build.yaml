name: Test VM with bootloader build

on: [push, pull_request]

jobs:
  test-vm-bootloader-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      
      - name: Check nix flakes
        run: nix flake check 

      - name: Build VM with bootloader derivation
        # Targets your darwinConfigurations.<name>.system attribute
        run: nix build .#nixosConfigurations.test-module.config.system.build.vmWithBootLoader
